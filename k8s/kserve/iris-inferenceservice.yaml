# ---------------------------------------------------------------------------
# KServe InferenceService — Iris ONNX model
# ---------------------------------------------------------------------------
# Target cluster : AKS
# KServe version : v0.16.0
# Deployment mode: RawDeployment (no KNative)
# Registry       : docker.cc.com
# Namespace      : kserve
# Ingress        : Istio gateway (istio-gateway/ingressgateway)
# Inference URL  : http://iris.azure.cc.com/v2/models/iris/infer
#
# Prerequisites:
#   1. Model image pushed: ./scripts/build-push.sh
#   2. imagePullSecret exists in kserve namespace:
#      kubectl get secret <your-secret-name> -n kserve
#
# Apply:
#   kubectl apply -f k8s/kserve/iris-inferenceservice.yaml
#
# Watch:
#   kubectl get inferenceservice iris -n kserve -w
#
# Test:
#   ./scripts/test-inference.sh
# ---------------------------------------------------------------------------

---
# ---------------------------------------------------------------------------
# ServiceAccount — attaches the registry imagePullSecret so the
# storage initializer can pull the model OCI image from docker.cc.com
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iris-sa
  namespace: kserve
imagePullSecrets:
  - name: docker-registry-creds.com

---
# ---------------------------------------------------------------------------
# InferenceService
# KServe auto-creates the VirtualService for iris.azure.cc.com
# based on the inferenceservice-config domainTemplate.
# ---------------------------------------------------------------------------
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: iris
  namespace: kserve
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    serviceAccountName: iris-sa
    model:
      modelFormat:
        name: onnx
      # OCI image containing model.onnx built by ./scripts/build-push.sh
      storageUri: oci://docker.cc.com/iris-onnx-model:v1
      protocolVersion: v2
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
